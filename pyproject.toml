[project]
name = "atmoswing-vigicrues"
version = "1.3.0"
authors = [
  { name="Pascal Horton", email="pascal.horton@terranum.ch" },
]
description = "Package to integrate AtmoSwing in the Vigicrues network."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "netCDF4",
    "numpy",
    "paramiko",
    "PySocks",
    "python-dateutil",
    "PyYAML",
    "requests",
]

[project.optional-dependencies]
grib = [
    "atmoswing-toolbox==1.3.7",
    "eccodes",
    "ecmwf-opendata>=0.3.35",
    "pandas",
]
dev = [
    "black",
    "flake8",
    "pre-commit",
]
tests = [
    "pytest",
    "pytest-cov",
]

[project.scripts]
asv_forecast = "atmoswing_vigicrues.__main__:main"

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
