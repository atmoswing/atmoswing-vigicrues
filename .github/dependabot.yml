version: 2
updates:
  # Image de base AtmoSwing Forecaster (épinglée par digest dans le Dockerfile)
  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: weekly

  # Versions des actions GitHub utilisées dans les workflows
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
