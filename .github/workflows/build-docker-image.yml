name: Build Docker Image

on:
  push:
    branches:
      - main
      - dev
    tags:
      - v*
  pull_request:
    branches:
      - main
      - dev
  release:
    types: [published]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: atmoswing/atmoswing-vigicrues

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build image for testing
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile
        load: true
        tags: atmoswing-vigicrues:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # Empêche la publication d'une image sans le module (ex. paquet 'UNKNOWN')
    - name: Smoke test
      run: |
        docker run --rm --entrypoint python3 atmoswing-vigicrues:test -c \
          "import atmoswing_vigicrues as asv; assert asv.has_netcdf and asv.has_eccodes"
        docker run --rm atmoswing-vigicrues:test --help
        docker run --rm --entrypoint sh atmoswing-vigicrues:test -c \
          "command -v atmoswing-forecaster"

    # Seul environnement de CI disposant d'eccodes (transformations GRIB)
    - name: Test suite in image
      run: |
        docker run --rm -v "$PWD:/repo" -w /repo --entrypoint sh \
          atmoswing-vigicrues:test -c \
          "python3 -m pip install -q pytest && python3 -m pytest -p no:cacheprovider"

    - name: Login to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

    - name: Push
      if: github.event_name != 'pull_request'
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
