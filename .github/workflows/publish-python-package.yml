name: Publish Python Package

on:
  release:
    types:
      - published

jobs:
  publish:

    runs-on: ubuntu-latest

    # Trusted publishing : PyPI authentifie le workflow via un jeton OIDC
    # (éditeur configuré sur PyPI pour atmoswing/atmoswing-vigicrues et ce fichier)
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build and check distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*

      - uses: pypa/gh-action-pypi-publish@release/v1
